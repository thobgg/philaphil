# Pakete fuer ein Release: PhilaAnd (APK), PhilaTux (deb) und PhilaWin (exe).
# Von Hand (Actions > Release > Run workflow): nur bauen, die Dateien liegen unter "Artifacts".
# Bei einem veroeffentlichten Release: bauen und die Dateien an das Release haengen.
#
# Das APK wird nur signiert, wenn die Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS und
# KEY_PASSWORD gesetzt sind. Ohne Secrets entsteht ein Debug-APK (installierbar, aber nicht
# updatefaehig auf ein signiertes Release).
name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore aus den Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOT
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOT
      - name: APK bauen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then ./gradlew --no-daemon :app:assembleRelease; else ./gradlew --no-daemon :app:assembleDebug; fi
          mkdir -p out && cp app/build/outputs/apk/*/PhilaAnd-*.apk out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PhilaAnd
          path: out/*.apk
      - name: An das Release haengen (nur signiert)
        if: github.event_name == 'release' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.apk --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # die dritte Versionsstelle ist die Zahl der Commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: deb bauen
        run: |
          ./gradlew --no-daemon :desktop:packageDeb
          mkdir -p out && cp desktop/build/compose/binaries/main/deb/*.deb out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PhilaTux
          path: out/*.deb
      - name: An das Release haengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.deb --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: exe bauen
        shell: bash
        run: |
          ./gradlew --no-daemon :desktop:packageExe
          mkdir -p out && cp desktop/build/compose/binaries/main/exe/*.exe out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PhilaWin
          path: out/*.exe
      - name: An das Release haengen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.exe --clobber
